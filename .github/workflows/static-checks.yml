name: Portable configuration checks (not hardware validation)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python tools/validate-config.py
      - run: python tools/generate-config.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/package-preview.py
