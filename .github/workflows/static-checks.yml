name: Configuration and Windows runtime checks (not hardware validation)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, pinned
        with:
          python-version: '3.12'
      - run: python tools/validate-config.py
      - run: python tools/generate-config.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/package-preview.py --check
  windows-runtime:
    name: Windows AHK syntax and Native registration (no hardware PASS)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, pinned
        with:
          python-version: '3.12'
      - run: python tools/validate-config.py
      - run: python tools/generate-config.py --check
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python tools/package-preview.py --check
      - name: Test module-path removal and Windows PowerShell autoload
        shell: pwsh
        run: ./tests/test-ci-module-path.ps1
      - name: Verify restricted token, elevated rejection and child exit code (no AHK)
        shell: pwsh
        run: ./tools/ci-run-ahk.ps1 -TokenTest
      - name: Download pinned AHK and verify both SHA256 hashes
        id: ahk
        shell: pwsh
        run: ./tools/prepare-ci-ahk.ps1
      - name: Run smoke under a verified standard-user token
        shell: pwsh
        env:
          MACFLOW_CI_AHK: ${{ steps.ahk.outputs.path }}
        run: ./tools/ci-run-ahk.ps1 -AutoHotkeyPath $env:MACFLOW_CI_AHK
